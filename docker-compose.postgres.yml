services:
  hashtopolis-backend:
    container_name: hashtopolis-backend
    image: hashtopolis/backend:latest
    restart: always
    volumes:
      - hashtopolis:/usr/local/share/hashtopolis:Z
      # - ./ssmtp.conf:/etc/ssmtp/ssmtp.conf
      # - ./jwks.json:/keys/jwks.json:ro
    environment:
      HASHTOPOLIS_DB_TYPE: postgres
      HASHTOPOLIS_DB_USER: $POSTGRES_USER
      HASHTOPOLIS_DB_PASS: $POSTGRES_PASSWORD
      HASHTOPOLIS_DB_HOST: $HASHTOPOLIS_DB_HOST
      HASHTOPOLIS_DB_DATABASE: $POSTGRES_DATABASE
      HASHTOPOLIS_ADMIN_USER: $HASHTOPOLIS_ADMIN_USER
      HASHTOPOLIS_ADMIN_PASSWORD: $HASHTOPOLIS_ADMIN_PASSWORD
      HASHTOPOLIS_BACKEND_URL: $HASHTOPOLIS_BACKEND_URL
      # Origins the API shares authenticated responses with, beyond its own. Needed when the frontend
      # is served from a different host; see env.*.example. Same-origin setups need neither this nor
      # HASHTOPOLIS_FRONTEND_PORT.
      HASHTOPOLIS_FRONTEND_URLS: $HASHTOPOLIS_FRONTEND_URLS
      # Shorthand for "the backend's own host and scheme, on this port". Set it to "" to switch it
      # off and let HASHTOPOLIS_FRONTEND_URLS be the whole story.
      HASHTOPOLIS_FRONTEND_PORT: 4200
    depends_on:
      - db
    ports:
      - "8080:80"
  db:
    container_name: db
    image: postgres:18
    restart: always
    volumes:
      - db:/var/lib/postgresql
    environment:
      POSTGRES_DB: $POSTGRES_DATABASE
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
  hashtopolis-frontend:
    container_name: hashtopolis-frontend
    image: hashtopolis/frontend:latest
    environment:
      HASHTOPOLIS_BACKEND_URL: $HASHTOPOLIS_BACKEND_URL
    restart: always
    depends_on:
      - hashtopolis-backend
    ports:
      - "4200:80" # When changing the host port don't forget to also update the HASHTOPOLIS_FRONTEND_PORT variable above
volumes:
  db:
  hashtopolis:
